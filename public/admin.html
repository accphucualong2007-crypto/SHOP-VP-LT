<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - SHOP VÕ PHỤC LT</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="wrap nav"><a class="logo" href="/">SHOP VÕ PHỤC LT - ADMIN</a><a href="/">Xem shop</a></div></header>
<main class="wrap admin"><div id="loginBox" class="panel login"><h2>Đăng nhập Admin</h2><form id="loginForm"><input name="password" type="password" placeholder="Mật khẩu" required><button class="btn full">Đăng nhập</button></form><p class="muted">Mặc định: <b>admin123</b></p></div>
<div id="dashboard" class="hidden"><div class="tabs"><button onclick="tab('products')">Sản phẩm</button><button onclick="tab('orders')">Đơn hàng</button><button onclick="tab('settings')">VietQR & Cài đặt</button><button onclick="logout()">Đăng xuất</button></div>
<section id="products" class="tab"><div class="section-head"><div><h2>Quản lý sản phẩm</h2></div><button class="btn" onclick="openEditor()">+ Thêm</button></div><div id="productList"></div></section>
<section id="orders" class="tab hidden"><div class="section-head"><h2>Đơn hàng</h2><button class="btn" onclick="loadOrders()">Làm mới</button></div><div id="orderList"></div></section>
<section id="settings" class="tab hidden"><div class="panel"><h2>Cấu hình VietQR</h2><form id="settingsForm" class="form-grid"><label>Tên shop<input name="shopName"></label><label>Mã ngân hàng<input name="bankId" placeholder="VD: MB"></label><label>Số tài khoản<input name="accountNumber"></label><label>Tên chủ tài khoản<input name="accountName"></label><label>Số điện thoại<input name="contactPhone"></label><label>Địa chỉ<input name="contactAddress"></label><label>Mật khẩu Admin mới<input name="adminPassword" type="password"></label><div><button class="btn">Lưu</button></div></form><p class="notice">QR tự tạo theo số tiền đơn + mã đơn.</p></div></section></div></main>
<div id="editor" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeEditor()">×</button><h2 id="editorTitle">Thêm sản phẩm</h2><form id="productForm" enctype="multipart/form-data"><input type="hidden" name="id"><label>Tên<input name="name" required></label><label>Giá<input name="price" type="number" required></label><label>Danh mục<input name="category"></label><label>Size<input name="sizes" placeholder="S,M,L,XL"></label><label>Mô tả<textarea name="description"></textarea></label><label>Tải ảnh<input name="image" type="file" accept="image/*"></label><label>Hoặc URL ảnh<input name="imageUrl"></label><img id="preview" class="preview hidden"><button class="btn full">Lưu sản phẩm</button></form></div></div>
<script src="/admin.js"></script></body></html>
