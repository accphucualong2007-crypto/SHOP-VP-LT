<!doctype html>
<html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOP VÕ PHỤC LT</title><link rel="stylesheet" href="/style.css">
</head><body>
<header><div class="wrap nav">
<a class="logo" href="/">SHOP VÕ PHỤC LT</a>
<nav><a href="#products">Sản phẩm</a><a href="/track.html">Tra cứu đơn</a><a href="#contact">Liên hệ</a><a href="/admin.html">Admin</a></nav>
<button class="cart-btn" onclick="openCart()">🛒 Giỏ hàng <b id="cartCount">0</b></button>
</div></header>
<section class="hero"><div class="wrap hero-inner"><div>
<div class="eyebrow">VÕ PHỤC • PHỤ KIỆN • ĐẶT HÀNG 24/7</div>
<h1>SHOP VÕ PHỤC LT</h1>
<p>Đặt võ phục online mọi lúc, mọi nơi. </p>
<a class="btn" href="#products">Xem sản phẩm</a> <a class="btn outline" href="/track.html">Tra cứu đơn</a>
</div><div class="hero-mark">🥋<small>ORDER ONLINE</small></div></div></section>
<main class="wrap">
<section id="products" class="section"><div class="section-head"><div><h2>Sản phẩm</h2><p>Chọn size rồi thêm sản phẩm vào giỏ.</p></div><input id="search" placeholder="Tìm sản phẩm..." oninput="renderProducts()"></div>
<div id="productsGrid" class="grid"></div></section>
<section id="contact" class="contact"><h2 id="shopName">SHOP VÕ PHỤC LT</h2><p id="contactInfo">Đang tải...</p></section>
</main>
<div id="cartModal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeCart()">×</button><h2>Giỏ hàng</h2><div id="cartItems"></div><div class="total">Tổng: <b id="cartTotal">0đ</b></div><button class="btn full" onclick="openCheckout()">Tiến hành đặt hàng</button></div></div>
<div id="checkoutModal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeCheckout()">×</button><h2>Thông tin đặt hàng</h2>
<form id="checkoutForm"><label>Họ tên<input name="name" required></label><label>Số điện thoại<input name="phone" required></label><label>Địa chỉ<input name="address" required></label><label>Ghi chú<textarea name="note"></textarea></label>
<label>Thanh toán<select name="paymentMethod"><option value="qr">VietQR ngân hàng</option><option value="cod">Thanh toán khi nhận hàng</option></select></label>
<button class="btn full">Xác nhận đặt hàng</button></form><div id="result"></div></div></div>
<script src="/app.js"></script></body></html>
